```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Circle Wine Shop | Calculator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="calculator">

            <div class="header">
                <div class="brand-row">
                    <div class="brand-mark">C</div>
                    <span class="student-badge">CIRCLE WINE SHOP</span>
                </div>
                <h1>Circle Wine Shop</h1>
                <p>Pour the right pick for your number.</p>
            </div>

            <div class="display">
                <input type="text" id="display" value="0" readonly>
            </div>

            <div class="drink-recommendation" id="drinkRecommendation" aria-live="polite">
                <div class="recommendation-copy">
                    <span class="recommendation-label">YOUR POUR</span>
                    <strong id="drinkName">Beer</strong>
                    <span id="drinkMessage">Numbers below 500 get a beer.</span>
                </div>
                <div class="drink-image beer-image" id="drinkImage" aria-hidden="true">🍺</div>
            </div>

            <div class="drink-buttons" aria-label="Drink selections">
                <button type="button" class="drink-button beer-button" onclick="showDrink('beer')">
                    <span class="drink-icon" aria-hidden="true">🍺</span>
                    <span>Beer</span>
                </button>
                <button type="button" class="drink-button whiskey-button" onclick="showDrink('whiskey')">
                    <span class="drink-icon" aria-hidden="true">🥃</span>
                    <span>Whiskey</span>
                </button>
            </div>

            <div class="buttons">

                <button onclick="clearDisplay()" class="special">AC</button>
                <button onclick="deleteLast()" class="special">⌫</button>
                <button onclick="chooseOperator('%')" class="operator">%</button>
                <button onclick="chooseOperator('/')" class="operator">÷</button>

                <button onclick="addNumber('7')">7</button>
                <button onclick="addNumber('8')">8</button>
                <button onclick="addNumber('9')">9</button>
                <button onclick="chooseOperator('*')" class="operator">×</button>

                <button onclick="addNumber('4')">4</button>
                <button onclick="addNumber('5')">5</button>
                <button onclick="addNumber('6')">6</button>
                <button onclick="chooseOperator('-')" class="operator">−</button>

                <button onclick="addNumber('1')">1</button>
                <button onclick="addNumber('2')">2</button>
                <button onclick="addNumber('3')">3</button>
                <button onclick="chooseOperator('+')" class="operator">+</button>

                <button onclick="addNumber('0')" class="zero">0</button>
                <button onclick="addNumber('.')">.</button>
                <button onclick="calculate()" class="equals">=</button>

            </div>

            <div class="footer">
                <p>Aurora Theatre <span aria-hidden="true">•</span> Powered by Flask</p>
            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
```
