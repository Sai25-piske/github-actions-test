name: Flask Calculator CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build --tag flask-calci:ci .

      - name: Export Docker image
        run: docker save flask-calci:ci --output flask-calci-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: flask-calci-image
          path: flask-calci-image.tar
          retention-days: 1

  deploy:
    name: Deploy to EC2
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v5
        with:
          name: flask-calci-image

      - name: Copy Docker image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ./flask-calci-image.tar
          target: /tmp/
          timeout: 120s
          command_timeout: 180s
          overwrite: true

      - name: Load and run Docker image on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            APP_DIR="/root/github-actions-test"

            echo "Deploying from $APP_DIR"

            docker load --input /tmp/flask-calci-image.tar

            rm -f /tmp/flask-calci-image.tar

            git -C "$APP_DIR" pull --ff-only origin main

            docker compose -f "$APP_DIR/compose.yaml" config --quiet

            docker compose -f "$APP_DIR/compose.yaml" up -d --no-build --remove-orphans

            docker compose -f "$APP_DIR/compose.yaml" ps
