name: Flask Calculator CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build --tag flask-calci:ci .

      - name: Export Docker image
        run: docker save flask-calci:ci --output flask-calci-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: flask-calci-image
          path: flask-calci-image.tar
          retention-days: 1

  deploy:
    name: Deploy to EC2
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v5
        with:
          name: flask-calci-image

      - name: Stream Docker image to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -eu
          key_file="$RUNNER_TEMP/ec2_deploy_key"
          known_hosts="$RUNNER_TEMP/ec2_known_hosts"

          umask 077
          printf '%s\n' "$EC2_SSH_KEY" > "$key_file"
          ssh-keyscan -H "$EC2_HOST" > "$known_hosts" 2>/dev/null

          ssh \
            -i "$key_file" \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=6 \
            -o UserKnownHostsFile="$known_hosts" \
            "$EC2_USER@$EC2_HOST" \
            "cat > /tmp/flask-calci-image.tar" \
            < ./flask-calci-image.tar

          rm -f "$key_file" "$known_hosts"

      - name: Load and run Docker image on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_DIR
          script_stop: true
          script: |
            set -eu
            APP_DIR="${APP_DIR:?EC2_APP_DIR is not configured}"

            if [ "$(id -u)" -eq 0 ]; then
              DOCKER="docker"
            else
              DOCKER="sudo -n docker"
            fi

            echo "Deploying from $APP_DIR"

            echo "Checking Docker access"
            $DOCKER version >/dev/null

            echo "Checking Docker image artifact"
            test -f /tmp/flask-calci-image.tar

            echo "Loading Docker image"
            $DOCKER load --input /tmp/flask-calci-image.tar

            echo "Removing temporary Docker image artifact"
            rm -f /tmp/flask-calci-image.tar

            echo "Pulling latest application code"
            git -C "$APP_DIR" pull --ff-only origin main

            echo "Checking Compose file"
            test -f "$APP_DIR/compose.yaml"

            echo "Validating Docker Compose configuration"
            $DOCKER compose -f "$APP_DIR/compose.yaml" config --quiet

            echo "Starting application container"
            $DOCKER compose -f "$APP_DIR/compose.yaml" up -d --no-build --remove-orphans

            echo "Showing application container status"
            $DOCKER compose -f "$APP_DIR/compose.yaml" ps
